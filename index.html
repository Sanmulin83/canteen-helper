<style>
:root{--primary:#4CAF50;--bg:#f1f8e9;--text:#333;--text-light:#777;--border:#e0e0e0;--blue:#2196F3}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,sans-serif;background:var(--bg);color:var(--text);padding-bottom:60px}
.header{background:var(--primary);color:#fff;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
.header h1{font-size:16px;font-weight:500}
.people-setting{display:flex;align-items:center;font-size:13px;background:rgba(255,255,255,0.2);padding:4px 8px;border-radius:6px}
.people-setting input{width:45px;margin:0 4px;padding:2px;border:none;border-radius:4px;text-align:center;font-size:13px;font-weight:bold;color:var(--primary)}
/* 底部导航：125% */
.bottom-nav{position:fixed;bottom:0;width:100%;background:#fff;display:flex;box-shadow:0 -2px 10px rgba(0,0,0,.05);z-index:10}
.nav-item{flex:1;border:none;background:none;padding:12.5px 0;font-size:15px;color:var(--text-light);display:flex;flex-direction:column;align-items:center;cursor:pointer}
.nav-item.active{color:var(--primary);font-weight:bold}
.nav-icon{font-size:25px}
.container{padding:12px}
.page{display:none}.page.active{display:block}
.card{background:#fff;border-radius:12px;padding:16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.card h3{font-size:16px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.hint{font-size:12px;color:var(--text-light);margin-bottom:12px}
.btn{padding:10px;border-radius:8px;border:none;font-size:14px;font-weight:500;text-align:center;cursor:pointer}
.btn-primary{background:var(--primary);color:#fff}
.btn-secondary{background:var(--blue);color:#fff}
.btn-warning{background:#FF9800;color:#fff}
.btn-danger{background:#F44336;color:#fff}
.btn-gray{background:#607D8B;color:#fff}
.btn-sm{padding:6px 10px;font-size:12px}
.btn-group{display:flex;gap:8px;margin-top:12px}
input[type=text],input[type=number],select{width:100%;padding:10px;border:1px solid var(--border);border-radius:8px;font-size:14px;margin-bottom:8px}
.file-box{border:2px dashed #bbb;padding:20px;text-align:center;border-radius:8px;background:#fafafa;margin-bottom:10px;cursor:pointer;display:block}
.list-item{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--border);font-size:14px;align-items:center}
.list-item:last-child{border-bottom:none}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);z-index:100;align-items:flex-end;padding-bottom:var(--kb,0px);transition:padding-bottom .15s ease-out}
.modal.active{display:flex}
.modal-content{background:#fff;width:100%;max-height:85%;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));overflow-y:auto;overscroll-behavior:contain}
/* 16px 以上可避免 iOS 聚焦输入框时自动放大页面 */
.modal-content input,.modal-content select,.modal-content textarea{font-size:16px}
.modal-header{display:flex;justify-content:space-between;margin-bottom:12px}
.close-btn{background:none;border:none;font-size:24px;cursor:pointer}
.ingredient-row{display:flex;gap:6px;margin-bottom:8px}
.ingredient-row .ing-name{flex:2}.ingredient-row .ing-amount{flex:1}.ingredient-row .ing-unit{flex:1}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.8);color:#fff;padding:10px 20px;border-radius:20px;font-size:14px;z-index:200;opacity:0;transition:.3s;pointer-events:none}
.toast.show{opacity:1}
.warn{background:#fff3e0;color:#e65100;padding:10px;border-radius:8px;font-size:12px;margin-top:10px;line-height:1.5}
.menu-edit-row{display:flex;align-items:flex-start;margin-bottom:12px;gap:8px}
.menu-edit-row label{width:60px;font-weight:500;color:var(--primary);padding-top:10px}
.menu-edit-row textarea{flex:1;padding:10px;border:1px solid var(--border);border-radius:8px;font-size:14px;font-family:inherit;resize:vertical;min-height:60px}
.category-title{margin:16px 0 8px 0;font-size:14px;font-weight:bold;color:var(--primary);border-bottom:2px solid var(--primary);padding-bottom:4px}
.badge-missing{background:#F44336;color:#fff;font-size:10px;padding:2px 5px;border-radius:4px;margin-left:5px;vertical-align:middle}
.cat-edit-item{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);font-size:14px}
.cat-edit-item span{flex:1}
.cat-edit-item select{width:130px;margin:0;padding:6px}
.switch-container{display:flex;align-items:center;justify-content:space-between;background:#e8f5e9;padding:10px;border-radius:8px;margin-bottom:12px;font-size:13px;color:#2e7d32}
.switch-container input{width:auto;margin:0;transform:scale(1.2)}
.btn-del-ing{background:#ffebee;color:#f44336;border:none;border-radius:50%;width:24px;height:24px;display:flex;justify-content:center;align-items:center;font-size:14px;margin-left:8px;cursor:pointer}
.batch-bar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.batch-bar select{width:auto;flex:1;margin-bottom:0;min-width:120px}
.checkbox-item{width:20px;height:20px;margin-right:8px}
/* 手风琴折叠样式 */
.accordion { border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.accordion-header { background: #f9fafb; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; font-weight: 500; font-size: 14px; color: var(--text); transition: background 0.2s; }
.accordion-header:hover { background: #f3f4f6; }
.accordion-body { display: none; padding: 16px; border-top: 1px solid var(--border); background: #fff; }
.accordion-body.open { display: block; }
.accordion-header .arrow { transition: transform 0.3s; font-size: 12px; color: var(--text-light); }
.accordion-header.open .arrow { transform: rotate(180deg); }
/* 底部高级管理区统一间距 */
.advanced-area { display: flex; flex-direction: column; gap: 12px; margin-top: 4px; }

/* 菜品库页面按钮优化 */
.recipe-toolbar{background:#fff;border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.toolbar-section{margin-bottom:14px}
.toolbar-section:last-child{margin-bottom:0}
.toolbar-label{font-size:12px;color:var(--text-light);margin-bottom:8px;font-weight:500}
/* 分段控件：模式切换 */
.segmented{display:flex;background:#eef1f5;border-radius:10px;padding:3px;gap:3px}
.segmented button{flex:1;border:none;background:transparent;padding:9px 0;font-size:13px;border-radius:8px;color:var(--text-light);font-weight:500;cursor:pointer;transition:.2s}
.segmented button.active{background:#fff;color:var(--primary);box-shadow:0 1px 4px rgba(0,0,0,.1)}
.segmented button.active.cloud{color:var(--blue)}
/* 等宽双按钮 */
.dual-btn{display:flex;gap:8px}
.dual-btn .btn{flex:1}
/* 视图切换：带计数的标签 */
.view-toggle{display:flex;gap:8px}
.view-toggle .btn{flex:1;position:relative}
.view-toggle .count-pill{display:inline-block;min-width:18px;padding:0 5px;height:18px;line-height:18px;background:rgba(255,255,255,.35);border-radius:9px;font-size:11px;margin-left:4px;vertical-align:middle}
.view-toggle .btn:not(.btn-warning) .count-pill{background:rgba(244,67,54,.15);color:#F44336}
/* 全宽主按钮 */
.btn-block{width:100%}
/* 安装到桌面：悬浮按钮 */
.pwa-install-btn{position:fixed;right:12px;bottom:76px;z-index:60;background:var(--blue);color:#fff;border:none;border-radius:22px;padding:10px 16px;font-size:13px;font-weight:500;box-shadow:0 4px 14px rgba(33,150,243,.35);cursor:pointer;animation:pwaPulse 2.4s ease-in-out infinite}
@keyframes pwaPulse{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
/* 从云端刷新按钮 */
.pull-btn{width:100%;margin-top:8px;background:#fff;border:1px solid var(--border);color:var(--blue);padding:8px;border-radius:6px;font-size:13px;font-weight:500;cursor:pointer;display:flex;justify-content:center;align-items:center;gap:4px;transition:background .2s}
.pull-btn:active{background:#f0f4ff}
.pull-btn:disabled{opacity:0.6;cursor:not-allowed}
</style>
</head>
<body>
<header class="header">
  <h1>贝尔安亲采购助手</h1>
  <div class="people-setting">
    就餐人数：<input type="number" id="global-people" value="250" inputmode="numeric" onchange="onPeopleChange()"> 人

<main class="container">
<section id="page-menu" class="page active">

    </div>

<div class="card"><h3>导入Excel菜单</h3><label class="file-box">📄 点击选择 Excel 文件 (.xlsx)<input type="file" id="excel-file" accept=".xlsx,.xls,.csv" onchange="handleExcelImport(event)" style="display:none"></label><p class="hint">支持横向表头，能完美处理合并单元格和并排多项，系统将自动解析。</p></div>
<div class="card"><h3>本周菜单概览</h3><div style="margin-bottom:10px;"><button id="btn-edit-menu" class="btn btn-secondary btn-sm" onclick="toggleMenuEdit()">✏️ 编辑本周菜单</button></div><div id="weekly-menu"><p class="hint">请先导入菜单</p></div><div id="weekly-menu-edit" style="display:none;"><p class="hint">修改后点击保存，采购清单将自动重算。</p><div id="menu-edit-inputs"></div><button class="btn btn-primary" style="width:100%;margin-top:8px" onclick="saveMenuEdit()">保存菜单修改</button></div></div>
</section>
<section id="page-shopping" class="page">
<div class="card">
  <h2>采购清单</h2>
  
  <div class="switch-container">
      <span><b>🧊 冻品提前一天采购</b> (如供应商送货晚请勾选)</span>

</div>
<div id="shopping-list"></div>
</section>
<section id="page-recipes" class="page">
<div class="recipe-toolbar">

    <div class="toolbar-label">存储模式</div>
    <div class="segmented">
      <button id="btn-mode-local" onclick="switchStorageMode('local')">📱 本地模式</button>

    <div class="toolbar-label">数据管理</div>

      <button class="btn btn-secondary" onclick="document.getElementById('import-json-file').click()">⬆️ 导入 JSON</button>

          <button class="btn btn-danger btn-sm" style="margin-bottom:8px" onclick="resetCategories()">🔄 重置为系统默认</button>
          <div id="category-manager" style="max-height:300px;overflow-y:auto;padding-right:4px"></div>
      </div>
  </div>
</div>

</section>
</main>

<script>

// ===== XSS 修复：统一 HTML 转义，所有拼进 innerHTML / 属性的用户可控数据都必须经过它 =====
function esc(s){
  return String(s==null?'':s)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#39;');
}

let basePeople = 250; 
let currentPeople = parseInt(localStorage.getItem('current_people')) || 250;
let deletedItems = JSON.parse(localStorage.getItem('deleted_items') || '{}');

function toggleAccordion(header) {

async function apiRequest(path,options={}){
let preferHeader='return=representation';
if(options.prefer){preferHeader+=','+options.prefer}
else if(options.method==='POST'){preferHeader+=',resolution=merge-duplicates'}
const headers={'apikey':SUPABASE_KEY,'Authorization':`Bearer ${SUPABASE_KEY}`,'Content-Type':'application/json','Prefer':preferHeader};

const signal = options.signal; 
const fetchOptions = {...options, headers: {...headers, ...options.headers}};
if(signal) fetchOptions.signal = signal;

const res=await fetch(`${SUPABASE_URL}/rest/v1/${path}`, fetchOptions);
if(!res.ok){const err=await res.json().catch(()=>({}));throw new Error(err.message||`请求失败 ${res.status}`)}
const text=await res.text();return text?JSON.parse(text):null;
}

async function fetchWithRetry(fn, retries = 2, delay = 1000, timeout = 8000) {
    for (let i = 0; i <= retries; i++) {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), timeout);
        try {
            const res = await fn(controller.signal);
            clearTimeout(timer);
            return res;
        } catch (e) {
            clearTimeout(timer);
            if (i === retries) throw e;
            await new Promise(r => setTimeout(r, delay));
        }
    }
}

function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000)}
function openModal(id){document.getElementById(id).classList.add('active');scheduleKeyboardSync(60)}

function saveLocalData(){
    localStorage.setItem('local_recipes',JSON.stringify(recipes));
    localStorage.setItem('local_aliases',JSON.stringify(aliases));
    localStorage.setItem('local_menu',JSON.stringify(menu));
    localStorage.setItem('custom_categories',JSON.stringify(customCategories));
    localStorage.setItem('deleted_items', JSON.stringify(deletedItems));
    localStorage.setItem('edited_items', JSON.stringify(editedItems));
}
function savePendingSync(){ localStorage.setItem('pending_sync', JSON.stringify(pendingSync)); }
function enqueueCategorySync(data){
    pendingSync = pendingSync.filter(op => op.type !== 'saveCategory');
    pendingSync.push({type:'saveCategory', data});
    savePendingSync();
}
function enqueueMenu(menuData){
    pendingSync = pendingSync.filter(op => op.type !== 'saveMenu');
    pendingSync.push({type:'saveMenu', data: menuData});
    savePendingSync();
}

function applyPendingOpsToMemory(ops){
    (ops||[]).forEach(op=>{
        if(!op) return;
        switch(op.type){
            case 'saveDish': if(op.data && op.data.dish_name) recipes[op.data.dish_name]=op.data.ingredients; break;
            case 'deleteDish': if(op.name) delete recipes[op.name]; break;
            case 'addAlias': if(op.data && op.data.alias) aliases[op.data.alias]=op.data.target_dish; break;
            case 'deleteAlias': if(op.name) delete aliases[op.name]; break;
            case 'saveCategory': if(op.data) customCategories=op.data; break;
            case 'saveMenu': if(op.data) menu=op.data; break;
            case 'deleteMenu': menu=null; break;
        }
    });
}

function getIngredientCategory(name) {
    if (customCategories[name]) return customCategories[name];
    if (name.match(/丸|鱼豆腐|培根|蟹棒|甜不辣|亲亲肠|鸡米花|鸡柳|鸡排|骨肉相连|虾滑|手抓饼|烤肠|香肠|热狗|鱼丸|虾饺|烧麦|速冻|冷冻/)) return '🧊 冻品/半成品';
    if (name.match(/肉|排|鸡|鸭|鱼|虾|蟹|肠|蛋|牛|羊|肚|骨|狮子头|翅|腿|腊肉|腊肠|火腿/)) return '🥩 肉蛋水产';
    if (name.match(/菜|瓜|豆|葱|蒜|姜|椒|茄|薯|菇|笋|藕|萝卜|番茄|西红柿|土豆|洋葱|玉米|芹菜|菠菜|生菜|白菜|胡萝卜/)) return '🥬 蔬菜菌菇';
    if (name.match(/油|盐|酱|醋|糖|粉|米|面|酒|抽|精|汁|料|火锅底料|孜然|花椒/)) return '🧂 粮油调料';
    if (name.match(/豆腐|豆干|腐竹|千张|豆皮|油豆腐/)) return '🧈 豆制品';
    return '📦 其他物资';
}

async function processPendingSync() {
    if (pendingSync.length === 0) return;
    document.getElementById('sync-status').innerHTML = `🔄 <b>正在补传离线修改 (${pendingSync.length})...</b>`;

    const groups = { saveDish: [], deleteDish: [], addAlias: [], deleteAlias: [] };
    const catOps = [];
    const menuOps = [];
    pendingSync.forEach(op => {
        if (op.type === 'saveCategory') {
            catOps.push(op);
        } else if (op.type === 'saveMenu') {
            menuOps.push(op);
        } else if (groups[op.type]) {
            groups[op.type].push(op);
        }
    });
    const lastCatOp = catOps.length > 0 ? catOps[catOps.length - 1] : null;
    const lastMenuOp = menuOps.length > 0 ? menuOps[menuOps.length - 1] : null;

    const succeeded = new Set();
    const markSucceeded = (op) => succeeded.add(op);

    for (let i = 0; i < groups.saveDish.length; i += 50) {
        const batch = groups.saveDish.slice(i, i + 50);
        try {
            await apiRequest('recipes?on_conflict=dish_name', {
                method: 'POST',
                prefer: 'return=representation,resolution=merge-duplicates',
                body: JSON.stringify(batch.map(op => op.data))
            });
            batch.forEach(markSucceeded);
        } catch (err) { 
            console.error('saveDish 批次失败', err); 
            alert('菜品上传失败：' + err.message);
        }
    }

    for (const op of groups.deleteDish) {
        try {
            await apiRequest(`recipes?dish_name=eq.${encodeURIComponent(op.name)}`, { method: 'DELETE' });
            markSucceeded(op);
        } catch (err) { 
            console.error('deleteDish 失败', op, err); 
            alert('删除菜品失败：' + err.message);
        }
    }

    for (let i = 0; i < groups.addAlias.length; i += 50) {
        const batch = groups.addAlias.slice(i, i + 50);
        try {
            await apiRequest('aliases?on_conflict=alias', {
                method: 'POST',
                prefer: 'return=representation,resolution=merge-duplicates',
                body: JSON.stringify(batch.map(op => op.data))
            });
            batch.forEach(markSucceeded);
        } catch (err) { 
            console.error('addAlias 批次失败', err); 
            alert('别名上传失败：' + err.message);
        }
    }

    for (const op of groups.deleteAlias) {
        try {
            await apiRequest(`aliases?alias=eq.${encodeURIComponent(op.name)}`, { method: 'DELETE' });
            markSucceeded(op);
        } catch (err) { 
            console.error('deleteAlias 失败', op, err); 
            alert('删除别名失败：' + err.message);
        }
    }

    if (lastCatOp) {
        try {
            await apiRequest('aliases?on_conflict=alias', {
                method: 'POST',
                prefer: 'return=representation,resolution=merge-duplicates',
                body: JSON.stringify({ alias: CATEGORY_KEY, target_dish: JSON.stringify(lastCatOp.data) })
            });
            catOps.forEach(markSucceeded);
        } catch (err) { 
            console.error('saveCategory 失败', err); 
            alert('分类同步失败：' + err.message);
        }
    }

    if (lastMenuOp) {
        try {
            const menuData = lastMenuOp.data || {};
            await apiRequest('menu?day_key=not.is.null', { method: 'DELETE' });
            for (const day of Object.keys(menuData)) {
                const dishes = Array.isArray(menuData[day]) ? menuData[day] : [];
                await apiRequest('menu?on_conflict=day_key', {
                    method: 'POST',
                    prefer: 'return=representation,resolution=merge-duplicates',
                    body: JSON.stringify({ day_key: day, dishes: dishes })
                });
            }
            menuOps.forEach(markSucceeded);
        } catch (err) { 
            console.error('saveMenu 失败', err); 
            alert('菜单同步失败：' + err.message);
        }
    }

    pendingSync = pendingSync.filter(op => !succeeded.has(op));
    savePendingSync();

    if (pendingSync.length === 0) {
        document.getElementById('sync-status').innerHTML = `🟢 <b>已连接云端（数据实时同步）</b>`;
        showToast('✅ 离线修改已全部补传');
    } else {
        document.getElementById('sync-status').innerHTML = `<span style="color:#E65100">🟡 离线缓存中，剩余 ${pendingSync.length} 条待同步</span>`;
    }
}

async function loadDataCloud(){
const pendingSnapshot = JSON.parse(JSON.stringify(pendingSync || []));
try{
const timeoutPromise=new Promise((_,reject)=>setTimeout(()=>reject(new Error('请求超时')),10000));
const fetchPromise=Promise.all([
    fetchWithRetry((signal)=>apiRequest('recipes?select=*', { signal })),
    fetchWithRetry((signal)=>apiRequest('aliases?select=*', { signal })),
    fetchWithRetry((signal)=>apiRequest('menu?select=*', { signal }))
]);
const [recipesData,aliasesData,menuData]=await Promise.race([fetchPromise,timeoutPromise]);
recipes={};aliases={};customCategories={};

(recipesData||[]).forEach(row=>{recipes[row.dish_name]=row.ingredients});
(aliasesData||[]).forEach(row=>{
    if(row.alias === CATEGORY_KEY) {
        try { customCategories = JSON.parse(row.target_dish); } catch(e){}
    } else {
        aliases[row.alias]=row.target_dish;
    }
});

if (Array.isArray(menuData)) {
    const hasPendingMenu = (pendingSnapshot || []).some(op =>
        op && (op.type === 'saveMenu' || op.type === 'deleteMenu')
    );
    if (!hasPendingMenu) {
        const m = {};
        menuData.forEach(row => {
            if (row && row.day_key && Array.isArray(row.dishes)) m[row.day_key] = row.dishes;
        });
        menu = Object.keys(m).length > 0 ? m : null;
    }
}

applyPendingOpsToMemory(pendingSnapshot);

saveLocalData();
document.getElementById('sync-status').innerHTML=`🟢 <b>已连接云端（数据实时同步）</b>`;
if(menu){renderWeeklyMenu();populateShoppingSelect();}
renderRecipeList();renderAliasList();updateMissingCount();renderCategoryManager();
}catch(err){
document.getElementById('sync-status').innerHTML=`<span style="color:#E65100">🟡 网络异常，已切换离线模式</span>`;
storageMode='local';
updateModeUI();
renderRecipeList();renderAliasList();updateMissingCount();
}
}

async function manualPullCloud() {
    if (storageMode === 'local') {
        if (!confirm('当前是本地模式。\n从云端刷新会拉取云端数据并覆盖本地显示，但你未同步的修改会被保留。确定继续吗？')) return;
    }
    const btn = document.getElementById('btn-pull-cloud');
    const originalText = btn.innerHTML;
    btn.innerHTML = '🔄 正在拉取...';
    btn.disabled = true;
    
    await loadDataCloud();
    
    btn.innerHTML = originalText;
    btn.disabled = false;
    showToast('✅ 云端数据已刷新');
}

function renderCategoryManager() {
    const box = document.getElementById('category-manager');
    let allIngredients = new Set();
    Object.values(recipes).forEach(ings => ings.forEach(ing => {
        if (!ing.name.startsWith('【备注】')) allIngredients.add(ing.name);
    }));

    let sortedIngredients = Array.from(allIngredients).sort((a,b)=>a.localeCompare(b,'zh'));
    
    const keyword = (document.getElementById('cat-search').value || '').trim().toLowerCase();
    if(keyword) {
        sortedIngredients = sortedIngredients.filter(name => name.toLowerCase().includes(keyword));
    }

    if(sortedIngredients.length === 0) {
        box.innerHTML = '<div class="hint">没有找到匹配的食材。</div>';
        return;
    }

    let html = '';
    sortedIngredients.forEach(ing => {
        let currentCat = getIngredientCategory(ing);
        let optionsHtml = ALL_CATEGORIES.map(cat => `<option value="${esc(cat)}" ${cat === currentCat ? 'selected' : ''}>${esc(cat)}</option>`).join('');
        
        html += `<div class="cat-edit-item">
            <input type="checkbox" class="checkbox-item cat-checkbox" value="${esc(ing)}">
            <span>${esc(ing)}</span>
            <select data-action="changeCategory" data-name="${esc(ing)}">
                ${optionsHtml}
            </select>
        </div>`;
    });
    box.innerHTML = html;
}

    customCategories[ingName] = newCat;
    saveLocalData();
    showToast(`已修改「${ingName}」的分类`);
    if(storageMode === 'cloud') {
        try { await apiRequest('aliases?on_conflict=alias',{method:'POST',prefer:'return=representation,resolution=merge-duplicates',body:JSON.stringify({alias: CATEGORY_KEY, target_dish: JSON.stringify(customCategories)})}) } catch(e){ pendingSync.push({type:'saveCategory', data: customCategories}); savePendingSync(); showToast('⚠️ 网络差，分类修改已排队待同步'); }
    } else {
        pendingSync.push({type:'saveCategory', data: customCategories});
        savePendingSync();
    }
}

    if(!confirm('确定要清空所有手动修改的分类吗？\n\n提示：重置后会自动将默认分类同步到云端。')) return;
    customCategories = {};
    saveLocalData();

    else { pendingSync.push({type:'saveCategory', data: {}}); savePendingSync(); }

async function saveDish(){
const name=document.getElementById('editdish-name').value.trim();if(!name)return alert('请输入菜名');
const noteVal = document.getElementById('editdish-note').value.trim();
const rows=document.querySelectorAll('#editdish-ingredients .ingredient-row');const ings=[];
rows.forEach(r=>{
    const n=r.querySelector('.ing-name').value.trim();
    const a=parseFloat(r.querySelector('.ing-amount').value);
    const u=r.querySelector('.ing-unit').value.trim() || '斤'; 
    if(n&&!isNaN(a))ings.push({name:n,amount:a,unit:u})
});
if (noteVal) { ings.push({name: `【备注】${noteVal}`, amount: 0, unit: ''}); }

if(ings.length===0)return alert('请至少填写一条有效食材');
if(editingDishName&&editingDishName!==name)delete recipes[editingDishName];
recipes[name]=ings;saveLocalData();
closeModal('editdish-modal');renderRecipeList();updateMissingCount();renderCategoryManager();
if(storageMode==='cloud'){
try{
if(editingDishName&&editingDishName!==name){await apiRequest(`recipes?dish_name=eq.${encodeURIComponent(editingDishName)}`,{method:'DELETE'})}
if(editingDishName===name){await apiRequest(`recipes?dish_name=eq.${encodeURIComponent(name)}`,{method:'PATCH',body:JSON.stringify({ingredients:ings})})}
else{await apiRequest('recipes?on_conflict=dish_name',{method:'POST',prefer:'return=representation,resolution=merge-duplicates',body:JSON.stringify({dish_name:name,ingredients:ings})})}
showToast('✅ 已保存到云端');
}catch(err){
if(editingDishName&&editingDishName!==name){pendingSync.push({type:'deleteDish',name:editingDishName});}
pendingSync.push({type:'saveDish',data:{dish_name:name,ingredients:ings}});savePendingSync();
showToast('⚠️ 网络差，已保存到本地');
}
}else{
if(editingDishName&&editingDishName!==name){pendingSync.push({type:'deleteDish',name:editingDishName});}
pendingSync.push({type:'saveDish',data:{dish_name:name,ingredients:ings}});
savePendingSync();
showToast('✅ 已保存到本地（待同步）');
}
if(missingDishesQueue.length>0){missingDishesQueue.shift();setTimeout(processMissingQueue,300)}
else if(menu){onShoppingDayChange(document.getElementById('shopping-day-select').value)}
}

async function importRecipesJSON(event){
const input=event.target;
const file=input.files[0];if(!file)return;
const reader=new FileReader();
reader.onload=async function(e){
try{
const json=JSON.parse(e.target.result);
if(typeof json!=='object'||json===null)throw new Error('文件内容不是有效的 JSON');
const rawDishes=Array.isArray(json)?json:json['菜品'];
if(!Array.isArray(rawDishes)||rawDishes.length===0)throw new Error('未找到"菜品"列表，请确认是本应用导出的 JSON 文件');
const aliasData=(json['别名表']&&typeof json['别名表']==='object')?json['别名表']:{};
const catData=(json['分类表']&&typeof json['分类表']==='object')?json['分类表']:{};
let ok=0,skip=0;
rawDishes.forEach(d=>{
    if(!d||typeof d.name!=='string'||!d.name.trim()||!Array.isArray(d.ingredients)||d.ingredients.length===0){skip++;return;}
    const ings=d.ingredients.filter(i=>i&&typeof i.name==='string'&&i.name.trim()&&!isNaN(parseFloat(i.amount))).map(i=>({name:i.name.trim(),amount:parseFloat(i.amount),unit:(typeof i.unit==='string'&&i.unit.trim())||'斤'}));
    if(ings.length===0){skip++;return;}
    recipes[d.name.trim()]=ings;ok++;
});
if(ok===0){alert(`导入失败：${rawDishes.length} 条记录全部不符合格式`);input.value='';return;}
for(let k in aliasData){if(k&&k!==CATEGORY_KEY&&typeof aliasData[k]==='string')aliases[k]=aliasData[k];}
for(let k in catData){if(k&&typeof catData[k]==='string'&&ALL_CATEGORIES.includes(catData[k]))customCategories[k]=catData[k];}
saveLocalData();renderRecipeList();renderAliasList();updateMissingCount();renderCategoryManager();
showToast(`✅ 已导入 ${ok} 道菜，正在同步云端`);
if(storageMode==='cloud'){await syncLocalToCloud()}
}catch(err){alert('导入失败：'+err.message)}
input.value='';
};
reader.readAsText(file);
}

async function syncLocalToCloud(){
try{
const rows=Object.keys(recipes).map(name=>({dish_name:name,ingredients:recipes[name]}));
const aliasRows=Object.keys(aliases).map(k=>({alias:k,target_dish:aliases[k]}));
aliasRows.push({alias: CATEGORY_KEY, target_dish: JSON.stringify(customCategories)});

for(let i=0;i<rows.length;i+=50){await apiRequest('recipes?on_conflict=dish_name',{method:'POST',prefer:'return=representation,resolution=merge-duplicates',body:JSON.stringify(rows.slice(i,i+50))})}
if(aliasRows.length>0){for(let i=0;i<aliasRows.length;i+=50){await apiRequest('aliases?on_conflict=alias',{method:'POST',prefer:'return=representation,resolution=merge-duplicates',body:JSON.stringify(aliasRows.slice(i,i+50))})}}

if(menu){
    await apiRequest('menu?day_key=not.is.null', { method: 'DELETE' });
    for(const day of Object.keys(menu)){
        await apiRequest('menu?on_conflict=day_key', {method:'POST', prefer:'return=representation,resolution=merge-duplicates', body:JSON.stringify({day_key:day, dishes:menu[day]})});
    }
}
showToast('✅ 同步到云端成功');
}catch(err){showToast('⚠️ 同步失败，请检查网络')}
}

function renderAliasList(){
const box=document.getElementById('alias-list');if(!box)return;
const keyword=(document.getElementById('alias-search').value||'').trim().toLowerCase();
let entries=Object.entries(aliases).filter(([from])=>from !== CATEGORY_KEY);
if(keyword)entries=entries.filter(([from,to])=>from.toLowerCase().includes(keyword)||to.toLowerCase().includes(keyword));
if(entries.length===0)return box.innerHTML=`<div class="hint">${keyword?'没有找到匹配的映射':'暂无映射。'}</div>`;

    if(aliases[pureName]&&recipes[aliases[pureName]])return recipes[aliases[pureName]];

    return null;
}

function handleExcelImport(e){

const reader=new FileReader();

function parseExcelRows(rows){
    if(!rows||rows.length<2)return alert('表格内容为空或格式错误');
    let headerIdx=-1;
    for(let i=0;i<Math.min(5,rows.length);i++){
        const rowStr = rows[i].map(cell => String(cell || '')).join('|');
        if(/星期|礼拜|周[一二三四五六日天]|Mon|Tue|Wed|Thu|Fri|Sat|Sun|Day/i.test(rowStr)){
            headerIdx=i; break;
        }
    }
    if(headerIdx===-1)headerIdx=0;

    const header=rows[headerIdx]||[];
    const dayCols={};
    const dayKeys=['星期一','星期二','星期三','星期四','星期五','星期六','星期日'];
    const shortKeys=['周一','周二','周三','周四','周五','周六','周日'];

    header.forEach((cell,idx)=>{
        const str=String(cell||'').trim();
        if(!str) return;
        for(let i=0;i<7;i++){
            if(str.includes(dayKeys[i])||str.includes(shortKeys[i])||str.includes(dayKeys[i].replace('星期','礼拜'))){
                dayCols[dayKeys[i]]=idx;
                return;
            }
        }
        if(str.length>0 && idx>0) {
            dayCols[str] = idx;
        }
    });

    if(Object.keys(dayCols).length===0){
        alert('未能识别出有效的星期列，请检查表头格式。');
        return;
    }

    const result={};Object.keys(dayCols).forEach(d=>result[d]=[]);
    
    // 默认初始状态为午餐
    let currentPeriod = '【午】'; 

    for(let i=headerIdx+1;i<rows.length;i++){
        const row=rows[i]||[];
        
        // 获取这一行所有列的文字，拼在一起找关键词
        // 这样不管你“午餐/晚餐”是写在第1列、还是合并单元格，只要这一行出现了，就能抓到！
        let rowText = row.map(cell => String(cell || '')).join(' ');

        // 核心：强制记忆状态
        if (rowText.includes('午餐') || rowText.includes('上午')) {
            currentPeriod = '【午】';
        } else if (rowText.includes('晚餐') || rowText.includes('下午')) {
            currentPeriod = '【晚】';
        }

        // 读取当天的菜名
        Object.keys(dayCols).forEach(day=>{
            const val=String(row[dayCols[day]]||'').trim();
            if(val){
                val.split(/[，,、\n\s]+/).forEach(name=>{
                    const n=name.trim();
                    // 排除掉表头本身和无关分类字眼
                    if(n && n !== '午餐' && n !== '晚餐' && n !== '上午' && n !== '下午' && n !== '主菜' && n !== '时蔬' && n !== '例汤' && n !== '主食'){
                        const taggedName = currentPeriod + n;
                        if(!result[day].includes(taggedName)) result[day].push(taggedName);
                    }
                });
            }
        });
    }

    const finalResult = {};
    Object.keys(result).forEach(day => {
        if(result[day].length > 0) finalResult[day] = result[day];
    });

    if(Object.keys(finalResult).length === 0) {
        return alert('表格中没有识别到任何菜品，请检查内容。');
    }

    menu=finalResult;
    localStorage.setItem('local_menu',JSON.stringify(menu));
    enqueueMenu(menu);
    renderWeeklyMenu();populateShoppingSelect();showToast('解析成功！');
    currentRecipeView='missing';setRecipeView('missing');checkAndPromptMissingDishes();
    if(storageMode==='cloud'){ processPendingSync().catch(()=>{}) }
}

function checkPorkDishes(dishes) {
    const otherMeatRegex = /鸡|鸭|牛|羊|鱼|虾|蟹|海鲜|鱿鱼|培根|腊肠|火腿/;
    const hardPorkRegex = /猪肉|五花|排骨|里脊|猪蹄|猪肝|大肠|猪骨|肉排|回锅肉|红烧肉|把子肉|肉段|肉饼/;
    const softPorkRegex = /肉丝|肉片|肉末|肉丸|肉丁|肉馅|炒肉|木须肉|咕噜肉/;

    let noonDishes = [];
    let nightDishes = [];

    dishes.forEach(dish => {
        const pureDish = dish.replace(/【(午|晚|上午|下午)】/g, '');
        let isPork = false;

        if (pureDish.includes('鱼香')) {
            isPork = true;
        } else if (otherMeatRegex.test(pureDish)) {
            isPork = false;
        } else {
            isPork = hardPorkRegex.test(pureDish) || softPorkRegex.test(pureDish);
        }
        
        if (isPork) {
            if (dish.includes('【午】') || dish.includes('【上午】')) {
                noonDishes.push(pureDish);
            } else if (dish.includes('【晚】') || dish.includes('【下午】')) {
                nightDishes.push(pureDish);
            } else {
                noonDishes.push(pureDish); 
            }
        }
    });

    if (noonDishes.length >= 2) return { count: noonDishes.length, type: '上午', list: noonDishes }; 
    if (nightDishes.length >= 2) return { count: nightDishes.length, type: '下午', list: nightDishes }; 
    return null; 
}

function getCalculatedDayItems(day) {
    const scale = currentPeople / basePeople;
    const mergeFrozen = document.getElementById('merge-frozen-toggle').checked;
    let currentItems = {};
    let dishes = menu[day] || [];
    const dayKeys = Object.keys(menu);
    const currentIndex = dayKeys.indexOf(day);

    dishes.forEach(dish => {
        const ingList = findRecipe(dish);
        if (!ingList) return;
        ingList.forEach(ing => {
            if (ing.name.startsWith('【备注】')) return;
            const cat = getIngredientCategory(ing.name);
            const key = ing.name + '|' + ing.unit;
            if (mergeFrozen && currentIndex > 0 && cat === '🧊 冻品/半成品') return; 
            if (!currentItems[key]) currentItems[key] = { name: ing.name, unit: ing.unit, qty: 0 };
            currentItems[key].qty += Number(ing.amount) * scale;
        });
    });

    if (mergeFrozen && currentIndex < dayKeys.length - 1) {
        let nextDay = dayKeys[currentIndex + 1];
        let nextDishes = menu[nextDay] || [];
        nextDishes.forEach(dish => {
            const ingList = findRecipe(dish);
            if (!ingList) return;
            ingList.forEach(ing => {
                if (ing.name.startsWith('【备注】')) return;
                const cat = getIngredientCategory(ing.name);
                if (cat === '🧊 冻品/半成品') {
                    const key = ing.name + '|' + ing.unit;
                    if (!currentItems[key]) currentItems[key] = { name: ing.name, unit: ing.unit, qty: 0 };
                    currentItems[key].qty += Number(ing.amount) * scale;
                }
            });
        });
    }

    let finalItems = {};
    const deletedForDay = deletedItems[day] || [];
    const editedForDay = editedItems[day] || {};
    Object.keys(currentItems).forEach(key => {
        if (!deletedForDay.includes(key)) {
            if (editedForDay[key] !== undefined) currentItems[key].qty = editedForDay[key];
            finalItems[key] = currentItems[key];
        }
    });
    return Object.values(finalItems);
}

function getFrozenWarning(day){
    if(!document.getElementById('merge-frozen-toggle').checked) return '';
    const dayKeys = Object.keys(menu);
    const currentIndex = dayKeys.indexOf(day);
    if (currentIndex < dayKeys.length - 1) {
        let nextDay = dayKeys[currentIndex + 1];
        let hasFrozen = (menu[nextDay] || []).some(dish => {
            const ings = findRecipe(dish);
            return ings && ings.some(i => !i.name.startsWith('【备注】') && getIngredientCategory(i.name) === '🧊 冻品/半成品');
        });
        if (hasFrozen) return `<div class="warn" style="background:#e3f2fd;color:#1565c0;margin-bottom:10px">❄️ 已自动包含「${esc(nextDay)}」的冻品</div>`;
    }
    return '';
}

            html += `</div>`;
        });
        if (missing.size > 0) html += `<div class="warn" style="margin:12px">⚠️ 注意：有些菜品缺失配方，未计入分类汇总：${[...missing].map(esc).join('、')}</div>`;
        html += `<div class="card" style="text-align:center"><button class="btn btn-warning" onclick="resetDeletedItems()">🔄 恢复所有被移除的食材</button></div>`;
        box.innerHTML = html;
    }
}

function buildDayCard(day){
    const items = getCalculatedDayItems(day);
    let listHtml = '';
    const frozenWarning = getFrozenWarning(day);

    items.sort((a,b)=>a.name.localeCompare(b.name,'zh')).forEach(it => {
        listHtml += `<div class="list-item">
            <span>${esc(it.name)}</span>
            <div style="display:flex;align-items:center">
                <span style="font-weight:bold;margin-right:10px;border-bottom:1px dashed #999;cursor:pointer" data-action="editQty" data-day="${esc(day)}" data-name="${esc(it.name)}" data-unit="${esc(it.unit)}">${Math.round(it.qty*100)/100} ${esc(it.unit)}</span>
                <button class="btn-del-ing" data-action="removeIngredient" data-day="${esc(day)}" data-name="${esc(it.name)}" data-unit="${esc(it.unit)}" title="移除该项">✕</button>
            </div>
        </div>`;
    });

    let dishes = menu[day] || [];
    let missing = dishes.filter(d => !findRecipe(d));
    if(missing.length > 0) listHtml += `<div class="warn">⚠️ 以下菜品在菜品库中没找到配方：${missing.map(m=>esc(m.replace(/【(午|晚)】/g, ''))).join('、')}</div>`;
    
    return `<div class="card">
        <h3>${esc(day)} 
            <button class="btn btn-secondary btn-sm" style="float:right" data-action="copyWechat" data-day="${esc(day)}">📋 复制发微信</button>
        </h3>
        ${frozenWarning}
        <div style="margin-top:10px">${listHtml || '无食材数据'}</div>
    </div>`;
}

function copyWechat(day){
    const items = getCalculatedDayItems(day);
    let text = `【贝尔安亲食堂 · ${day}食材采购清单】\n\n`;
    let categoryItems = {};
    items.forEach(it => {
        let cat = getIngredientCategory(it.name);
        if(!categoryItems[cat]) categoryItems[cat] = [];
        categoryItems[cat].push(it);
    });
    const sortedCats = Object.keys(categoryItems).sort();
    sortedCats.forEach(cat => {
        text += `【${cat}】\n`;
        let catItems = categoryItems[cat].sort((a,b)=>a.name.localeCompare(b.name,'zh'));
        catItems.forEach(it => { text += `${it.name} ${Math.round(it.qty*100)/100}${it.unit}\n`; });
        text += `\n`;
    });
    text += `—— 请按清单采购，谢谢！`;
    copyTextWithFallback(text).then(ok => {
        if (ok) { showToast('✅ 已复制，去微信粘贴吧'); } else { alert('复制失败，请长按文字手动复制'); }
    });
}

function copyCategoryWechat(day) {
    let targetDays = (day === 'all' || !day) ? Object.keys(menu) : [day];
    let categoryItems = {};
    targetDays.forEach(d => {
        getCalculatedDayItems(d).forEach(it => {
            let cat = getIngredientCategory(it.name);
            if(!categoryItems[cat]) categoryItems[cat] = {};
            const key = it.name + '|' + it.unit;
            if(!categoryItems[cat][key]) categoryItems[cat][key] = { name: it.name, unit: it.unit, qty: 0 };
            categoryItems[cat][key].qty += it.qty;
        });
    });

    let text = `【贝尔安亲食堂 · ${day==='all'?'一周':day}采购分类汇总】\n\n`;
    const sortedCats = Object.keys(categoryItems).sort();
    sortedCats.forEach(cat => {
        text += `【${cat}】\n`;
        let items = Object.values(categoryItems[cat]).sort((a,b)=>a.name.localeCompare(b.name,'zh'));
        items.forEach(it => { text += `${it.name} ${Math.round(it.qty*100)/100}${it.unit}\n`; });
        text += `\n`;
    });
    text += `—— 请按分类采购，谢谢！`;
    copyTextWithFallback(text).then(ok => {
        if (ok) { showToast('✅ 分类汇总已复制'); } else { alert('复制失败，请长按文字手动复制'); }
    });
}

function clearRecipeSearch(){
    const input = document.getElementById('recipe-search');
    if(input){ input.value = ''; }
    renderRecipeList();
    showToast('已清空搜索');
}

function renderRecipeList(){
const box=document.getElementById('recipe-list');const keyword=document.getElementById('recipe-search').value.trim().toLowerCase();
let names=(currentRecipeView==='missing'?getMissingDishes():Object.keys(recipes)).filter(name=>{
if(!keyword)return true;if(name.toLowerCase().includes(keyword))return true;
const ings=recipes[name];if(ings&&Array.isArray(ings))return ings.some(ing=>ing.name.toLowerCase().includes(keyword));return false;
}).sort();
box.innerHTML=names.map(name=>{
const isMissing=!recipes[name];let ingsHtml='';
let noteHtml='';
if(isMissing){
    ingsHtml='<span style="color:#e65100">暂未填写配方</span>';
}else{
    const noteItem = recipes[name].find(i => i.name.startsWith('【备注】'));
    const normalIngs = recipes[name].filter(i => !i.name.startsWith('【备注】'));
    if (noteItem) {
        const noteText = noteItem.name.replace('【备注】', '');
        noteHtml = `<div style="display:inline-block; background:#fff3e0; color:#e65100; padding:2px 6px; border-radius:4px; font-size:11px; margin-top:6px; font-weight:bold;">💡 ${esc(noteText)}</div><br>`;
    }
    ingsHtml=normalIngs.map(i=>{const isMatch=keyword&&i.name.toLowerCase().includes(keyword);return isMatch?`<b style="color:#4CAF50">${esc(i.name)}${esc(i.amount)}${esc(i.unit)}</b>`:`${esc(i.name)}${esc(i.amount)}${esc(i.unit)}`}).join('、');
}

let titleHtml = esc(name);
if (isMissing) titleHtml += `<span class="badge-missing">需补全</span>`;

return `<div class="card" style="margin-bottom:8px;padding:12px;border-left:4px solid ${isMissing?'#ffb74d':'#4CAF50'}">
<div style="display:flex;justify-content:space-between;align-items:flex-start">
<div style="flex:1;min-width:0;margin-right:10px">
<div style="font-weight:bold;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${titleHtml}</div>
<div class="hint" style="margin:4px 0 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${ingsHtml}</div>
${noteHtml}
</div>
<div style="display:flex;gap:6px;flex-shrink:0">
${!isMissing?`<button class="btn btn-danger btn-sm" data-action="deleteDish" data-name="${esc(name)}">删除</button>`:''}
<button class="btn ${isMissing?'btn-warning':'btn-secondary'} btn-sm" data-action="editDish" data-name="${esc(name)}" data-missing="${isMissing}">${isMissing?'补充':'编辑'}</button>
</div></div></div>`;
}).join('')||`<div class="hint" style="text-align:center;padding:20px">${currentRecipeView==='missing'?(menu?'太棒了，没有缺失的菜品！':'暂无菜单数据，请先在菜单页导入 Excel'):'没有找到匹配的菜品或食材'}</div>`;
}

function handleEdit(name, isMissing){ openEditDishModal(name, isMissing); }

function openEditDishModal(name,isMissing=false){
editingDishName=isMissing?null:name;document.getElementById('modal-title').textContent=isMissing?'补充新菜品配方':'编辑菜品';
const tip=document.getElementById('modal-tip');tip.style.display=isMissing?'block':'none';
if(isMissing)tip.textContent=`请补充「${name}」的食材配方：`;
document.getElementById('editdish-name').value=name;

const ings = !isMissing && recipes[name] ? recipes[name] : [];
let noteText = '';
const noteItem = ings.find(i => i.name.startsWith('【备注】'));
if (noteItem) noteText = noteItem.name.replace('【备注】', '');
document.getElementById('editdish-note').value = noteText;

const box=document.getElementById('editdish-ingredients');box.innerHTML='';
const normalIngs = ings.filter(i => !i.name.startsWith('【备注】'));
if(normalIngs.length>0)normalIngs.forEach(addIngredientRow);else addIngredientRow();
openModal('editdish-modal');
}

function addIngredientRow(ing={name:'',amount:'',unit:'斤'}){
const box=document.getElementById('editdish-ingredients');const div=document.createElement('div');
div.className='ingredient-row';
const baseUnits = ['斤','个','包','袋','瓶','桶'];
let actualUnits = new Set(baseUnits);
Object.values(recipes).forEach(ings => {
    if(Array.isArray(ings)) {
        ings.forEach(i => { if(i.unit && i.unit.trim() && !i.name.startsWith('【备注】')) actualUnits.add(i.unit.trim()); });
    }
});
if (ing.unit) actualUnits.add(ing.unit);
const unitOptions = Array.from(actualUnits).map(u => `<option value="${esc(u)}"></option>`).join('');
div.innerHTML=`
    <input type="text" class="ing-name" placeholder="食材" value="${esc(ing.name)}" inputmode="text">
    <input type="number" class="ing-amount" placeholder="用量" value="${esc(ing.amount)}" inputmode="decimal">
    <input type="text" class="ing-unit" placeholder="斤" list="dynamic-units" value="${ing.unit === '斤' ? '' : esc(ing.unit)}" inputmode="text">
    <datalist id="dynamic-units">${unitOptions}</datalist>
`;
box.appendChild(div);
}

function copyTextWithFallback(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
        return navigator.clipboard.writeText(text).then(() => { return true; }).catch(() => { return fallbackCopy(text); });
    }
    return Promise.resolve(fallbackCopy(text));
}

function fallbackCopy(text) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.left = '-9999px';
    ta.style.top = '0';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    ta.setSelectionRange(0, text.length);
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    return ok;
}

window.onload=()=>{
    document.getElementById('global-people').value = currentPeople;
    const savedToggle = localStorage.getItem('merge_frozen_default');
    document.getElementById('merge-frozen-toggle').checked = (savedToggle !== 'false');
    initBatchSelect(); 
    loadData();
};

function syncKeyboardOffset() {
    const vv = window.visualViewport;
    const active = document.activeElement;
    const typing = !!active && /^(INPUT|TEXTAREA|SELECT)$/.test(active.tagName);
    let kb = 0;
    if (vv && typing) kb = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
    document.documentElement.style.setProperty('--kb', kb + 'px');
}

function scheduleKeyboardSync(delay = 120) {
    syncKeyboardOffset();
    setTimeout(syncKeyboardOffset, delay);
}

function keepFieldVisible(el) {
    const box = el.closest ? el.closest('.modal-content') : null;
    if (!box) return;
    const r = el.getBoundingClientRect();
    const b = box.getBoundingClientRect();
    const pad = 20;
    if (r.bottom > b.bottom - pad) box.scrollTop += r.bottom - (b.bottom - pad);
    else if (r.top < b.top + pad) box.scrollTop -= (b.top + pad) - r.top;
}

if (window.visualViewport) {
    visualViewport.addEventListener('resize', () => scheduleKeyboardSync(80));
    visualViewport.addEventListener('scroll', () => scheduleKeyboardSync(80));
}
window.addEventListener('resize', syncKeyboardOffset);
window.addEventListener('orientationchange', () => scheduleKeyboardSync(300));

document.addEventListener('focusin', e => {
    if (!e.target.closest || !e.target.closest('.modal')) return;
    scheduleKeyboardSync(300);
    setTimeout(() => keepFieldVisible(e.target), 350);
});

document.addEventListener('focusout', e => {
    if (!e.target.closest || !e.target.closest('.modal')) return;
    setTimeout(syncKeyboardOffset, 120);
});

if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(err => {
            console.warn('Service Worker 注册失败:', err);
        });
    });
}

document.addEventListener('click', function(e){
    const el = e.target && e.target.closest ? e.target.closest('[data-action]') : null;
    if(!el) return;
    const d = el.dataset;
    const action = el.getAttribute('data-action');
    switch(action){
        case 'removeIngredient': removeIngredient(d.day, d.name, d.unit); break;
        case 'removeIngredientAgg': removeIngredientAgg(d.day, d.name, d.unit); break;
        case 'copyWechat': copyWechat(d.day); break;
        case 'copyCategoryWechat': copyCategoryWechat(d.day); break;
        case 'deleteDish': handleDelete(d.name); break;
        case 'editDish': handleEdit(d.name, d.missing==='true'); break;
        case 'deleteAlias': deleteAlias(d.name); break;
        case 'editQty': editIngredientQty(d.day, d.name, d.unit); break;
    }
});
document.addEventListener('change', function(e){
    const sel = e.target && e.target.closest ? e.target.closest('[data-action="changeCategory"]') : null;
    if(!sel) return;
    changeIngredientCategory(sel.getAttribute('data-name'), sel.value);
});

let deferredInstallPrompt = null;
const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent) && !window.MSStream;
const isStandalone = () => window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;

function refreshInstallUI() {
    const btn = document.getElementById('pwa-install-btn');
    if (!btn) return;
    if (isStandalone()) { btn.style.display = 'none'; return; }
    if (deferredInstallPrompt) { btn.textContent = '⬇️ 安装到桌面'; btn.style.display = 'block'; return; }
    if (isIOS()) { btn.textContent = '📲 添加到主屏幕'; btn.style.display = 'block'; return; }
    btn.style.display = 'none';
}

window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredInstallPrompt = e;
    refreshInstallUI();
});

window.addEventListener('appinstalled', () => {
    deferredInstallPrompt = null;
    refreshInstallUI();
    showToast('✅ 已安装到桌面');
});

async function installPWA() {
    if (!deferredInstallPrompt) {
        if (isIOS()) {
            alert('iPhone / iPad 不支持网页弹出的安装窗口。\n\n请用 Safari 打开本页 → 点底部「分享」按钮 → 选择「添加到主屏幕」。');
        } else {
            alert('当前浏览器没有给出安装入口。请确认：\n1. 用 Chrome / Edge 打开，网址是 https:// 开头；\n2. 首次打开后刷新一次再试；\n3. 也可以从浏览器菜单里选「安装应用 / 添加到主屏幕」。');
        }
        return;
    }
    deferredInstallPrompt.prompt();
    const choice = await deferredInstallPrompt.userChoice;
    deferredInstallPrompt = null;
    refreshInstallUI();
    if (choice && choice.outcome === 'accepted') showToast('正在安装，请稍候…');
}

window.matchMedia('(display-mode: standalone)').addEventListener?.('change', refreshInstallUI);
refreshInstallUI();
</script>
